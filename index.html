<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Magic ✨</title><style>
body{margin:0;background:#090313;color:white;font:16px Arial;text-align:center;padding:25px}main{max-width:600px;margin:auto;background:#180820;padding:25px;border-radius:25px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:14px;border-radius:15px;border:1px solid #765;color:white;background:#090313}button{background:linear-gradient(90deg,#ff9f1c,#ff4f9a);font-weight:bold}img{max-width:100%;border-radius:18px}h1{color:#ffd36a}#app{display:none}
</style></head><body><main><div id="form"><h1>🎂 Birthday Magic</h1><input id="n" placeholder="Birthday Person"><input id="s" placeholder="Your Name"><input id="r" placeholder="Relation"><textarea id="m" placeholder="Birthday Message"></textarea><input id="p1" type="file" accept="image/*"><input id="p2" type="file" accept="image/*"><input id="p3" type="file" accept="image/*"><button onclick="create()">✨ CREATE SURPRISE</button><p id="st"></p></div><div id="app"><h1>🎂 Happy Birthday <span id="nm"></span> ❤️</h1><img id="pic"><p id="tx"></p><button onclick="next()">Next ❤️</button></div></main>
<script>
const U="https://mlwfuysdbqzgwfgzqwd.supabase.co",K="sb_publishable_lloRqy5KDRMkrkVBasR_VA_L5BLtqW4";
let d,i=0;
async function up(f){
 let x=Date.now()+"-"+f.name.replace(/\W/g,"");
 let q=await fetch(U+"/storage/v1/object/birthday/"+x,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":f.type},body:f});
 if(!q.ok)throw Error(await q.text());
 return U+"/storage/v1/object/public/birthday/"+x;
}
async function create(){
 try{
  if(!n.value.trim())return st.textContent="Name required";
  st.textContent="Uploading...";
  let a=[];
  for(let j=1;j<4;j++){let f=document.getElementById("p"+j).files[0];if(f)a.push(await up(f))}
  let id=crypto.randomUUID(),p={name:n.value,sender:s.value,relation:r.value,message:m.value,photos:a};
  let q=await fetch(U+"/rest/v1/birthday_surprises",{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({id,payload:p})});
  if(!q.ok)throw Error(await q.text());
  let link=location.origin+location.pathname+"?id="+id;
  st.innerHTML="DONE ❤️<br><input value='"+link+"' readonly>";
 }catch(e){st.textContent="ERROR: "+e.message}
}
async function load(){
 let id=new URLSearchParams(location.search).get("id");if(!id)return;
 let q=await fetch(U+"/rest/v1/birthday_surprises?id=eq."+id+"&select=payload",{headers:{apikey:K}});
 if(!q.ok)return;
 let a=await q.json();if(!a[0])return;
 d=a[0].payload;form.style.display="none";app.style.display="block";show();
}
function show(){nm.textContent=d.name;pic.src=d.photos[i]||"";tx.textContent=d.message||"Have a beautiful birthday! ❤️"}
function next(){if(i<d.photos.length-1){i++;show()}else alert("🎉 Happy Birthday ❤️")}
load();
</script></body></html>
