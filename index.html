<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For MEGHA ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#42106b,#10051b 55%,#050207);
}

#app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,80,170,.18),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(120,70,255,.16),transparent 35%);
}

.card{
  width:min(440px,100%);
  min-height:570px;
  padding:26px;
  border-radius:30px;

  background:rgba(20,8,30,.86);
  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    0 25px 80px rgba(0,0,0,.7),
    inset 0 0 40px rgba(255,100,190,.04);

  backdrop-filter:blur(18px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;

  animation:popup .55s ease;
}

@keyframes popup{
  from{
    opacity:0;
    transform:scale(.75) translateY(40px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

h1{
  font-size:48px;
  margin:14px 0;

  background:linear-gradient(
    90deg,
    #ffd4e8,
    #ffffff,
    #ff77b7
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

h2{
  font-size:30px;
  margin:12px 0 18px;
}

p{
  color:#eadfeb;
  line-height:1.7;
  font-size:16px;
}

.small{
  color:#b9a6c5;
  font-size:13px;
}

.emoji{
  font-size:70px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{
    transform:translateY(-10px);
  }
}

button{
  margin-top:25px;
  padding:14px 25px;

  border:none;
  border-radius:50px;

  color:white;
  background:
    linear-gradient(135deg,#ff3f91,#8658ff);

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 12px 30px rgba(255,70,150,.25);

  transition:.2s;
}

button:hover{
  transform:translateY(-2px) scale(1.03);
}

button:active{
  transform:scale(.94);
}

.photo{
  width:100%;
  height:350px;

  object-fit:cover;

  border-radius:22px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.65);

  margin-bottom:18px;
}

.caption{
  font-size:15px;
  color:#f4d9e8;
}

.cake{
  font-size:90px;
  margin-bottom:5px;
}

.candles{
  font-size:43px;
  letter-spacing:7px;
  margin:8px 0;
}

.progress{
  position:fixed;
  top:12px;
  left:50%;

  transform:translateX(-50%);

  width:min(400px,80%);
  height:4px;

  border-radius:10px;

  background:rgba(255,255,255,.12);

  z-index:20;
}

.bar{
  height:100%;
  width:12%;
  border-radius:10px;

  background:
    linear-gradient(90deg,#ff4297,#9670ff);

  transition:.5s;
}

.hearts{
  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:10;
}

.heart{
  position:absolute;
  bottom:-40px;

  animation:rise linear forwards;

  opacity:.85;
}

@keyframes rise{
  to{
    transform:
      translateY(-110vh)
      rotate(360deg);

    opacity:0;
  }
}

.credit{
  margin-top:22px;
  color:#95849f;
  font-size:12px;
}
