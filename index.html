<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Magic 🎂</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#08030f,#25082f);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.box{max-width:650px;margin:30px auto;padding:22px;background:#16091f;border:1px solid #63335f;border-radius:25px}h1{text-align:center;color:#ffd36a}.g{margin:14px 0}label{display:block;margin-bottom:7px;color:#ffddea;font-weight:bold}input,textarea,button{width:100%;padding:14px;border-radius:14px;border:1px solid #654466;background:#08030d;color:#fff;font-size:16px}textarea{min-height:100px}button{background:linear-gradient(90deg,#ff9f1c,#ff4f9a);border:0;font-weight:bold;margin-top:10px}.mem{padding:15px;margin:15px 0;border:1px solid #56345c;border-radius:18px}.mem h2{color:#ffd36a;font-size:20px}.hide{display:none}.pic{width:100%;max-height:430px;object-fit:contain;border-radius:18px;margin:15px 0}.msg{background:#0a0410;padding:18px;border-radius:18px;line-height:1.7;white-space:pre-wrap}.link{font-size:12px}.gold{color:#ffd36a;text-align:center}.nav{display:flex;gap:10px}.nav button{width:50%}</style></head><body>
<div id="app"></div><script>
const A=document.getElementById("app");
const enc=s=>btoa(unescape(encodeURIComponent(JSON.stringify(s))))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

const dec=s=>{
  s=s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  return JSON.parse(decodeURIComponent(escape(atob(s))));
};

function page(x){A.innerHTML=x}
function setup(){
page(`<div class="box"><h1>🎂 Birthday Magic</h1>
<div class="g"><label>Birthday Person *</label><input id="n" placeholder="e.g. Megha"></div>
<div class="g"><label>Your Name</label><input id="s" placeholder="e.g. Devraj"></div>
<div class="g"><label>Relation</label><input id="r" placeholder="e.g. Friend"></div>
<div class="g"><label>Birthday Message</label><textarea id="fm" placeholder="Write your special birthday message..."></textarea></div>
<div id="ms"></div><button onclick="create()">✨ CREATE SURPRISE</button><p id="st" class="gold"></p><div id="share"></div></div>`);
let m="";for(let i=1;i<=3;i++)m+=`<div class="mem"><h2>📸 Memory ${i}</h2><input id="f${i}" type="file" accept="image/*"><textarea id="c${i}" placeholder="Memory message (optional)"></textarea></div>`;document.getElementById("ms").innerHTML=m}
function img(file){
return new Promise((ok,no)=>{
if(!file)return ok("");
let q=new FileReader;q.onload=()=>{let im=new Image;im.onload=()=>{
let w=Math.min(im.width,700),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);ok(c.toDataURL("image/jpeg",.55))};im.src=q.result};q.onerror=no;q.readAsDataURL(file)})
}
async function create(){
let n=document.getElementById("n").value.trim();if(!n){alert("Birthday Person ka naam do");return}
document.getElementById("st").textContent="⏳ Creating...";
let mem=[];for(let i=1;i<=3;i++){let f=document.getElementById("f"+i).files[0],c=document.getElementById("c"+i).value.trim();if(f)mem.push({i:await img(f),c:c})}
let d={n:n,s:document.getElementById("s").value.trim()||"Someone",r:document.getElementById("r").value.trim(),f:document.getElementById("fm").value.trim()||"Wishing you a very Happy Birthday! ❤️",m:mem};
let link=location.origin+location.pathname+"#"+enc(d);
document.getElementById("st").textContent="✅ Surprise ready!";
document.getElementById("share").innerHTML=`<div class="g"><input class="link" id="lnk" value="${link}" readonly></div><button onclick="navigator.clipboard.writeText(document.getElementById('lnk').value);alert('Link copied!')">📋 COPY LINK</button><button onclick="location.href=document.getElementById('lnk').value">💖 OPEN SURPRISE</button>`}
let D;
function open(){
try{D=dec(location.hash.slice(1))}catch(e){setup();return}
let i=0;
function render(){
if(i<D.m.length){
let z=D.m[i];page(`<div class="box"><p class="gold">💖 MEMORY ${i+1} OF ${D.m.length}</p><h1>${D.n} ❤️</h1><img class="pic" src="${z.i}"><div class="msg">${z.c||"A beautiful memory to keep forever. ❤️"}</div><div class="nav"><button onclick="i--;render()">← Previous</button><button onclick="i++;render()">${i==D.m.length-1?"Continue ❤️":"Next ❤️"}</button></div></div>`)
}else cake()}
function cake(){page(`<div class="box"><h1>🎂 One Last Surprise ✨</h1><p class="gold">Make a wish, ${D.n}!</p><div style="font-size:100px;text-align:center">🎂</div><button onclick="final()">🕯️ BLOW OUT THE CANDLES</button></div>`)}
window.final=()=>page(`<div class="box"><h1>🎉 Happy Birthday ${D.n}! ❤️</h1><p class="gold">From ${D.s} • ${D.r}</p><div class="msg">${D.f}</div>${D.m.map(x=>`<img class="pic" src="${x.i}">`).join("")}<button onclick="location.hash='';setup()">🔄 CREATE ANOTHER</button></div>`);
window.render=render;render()}
window.addEventListener("load",()=>{
  if(location.hash && location.hash.length>1) open();
  else setup();
});
</script></body></html>
