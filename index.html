<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Premium Birthday Surprise</title>
  
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #d6336c;
      --primary-light: #ff87ab;
      --gold: #f5b041;
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #eaedee 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-dark: #2d3436;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Animations Container */
    #bg-animations {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      padding: 35px 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08), 0 5px 15px rgba(214, 51, 108, 0.1);
      position: relative;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
      color: var(--primary);
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    h1 { font-size: 2rem; }
    
    .script-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: var(--primary);
      display: block;
      margin: 10px 0;
      text-shadow: 2px 2px 4px rgba(214, 51, 108, 0.15);
    }

    /* Form Styles */
    .form-group { margin-bottom: 20px; text-align: left; }
    label { font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; display: block; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    input, textarea {
      width: 100%; padding: 14px;
      border: 2px solid #e1e1e1; border-radius: 12px;
      font-family: inherit; font-size: 1rem;
      background: rgba(255,255,255,0.9); transition: all 0.3s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(255, 135, 171, 0.2); }
    
    .btn {
      background: linear-gradient(45deg, var(--primary), var(--primary-light));
      color: white; border: none; padding: 16px;
      font-size: 1.1rem; font-weight: 600; font-family: 'Montserrat', sans-serif;
      border-radius: 50px; cursor: pointer; width: 100%;
      margin-top: 10px; box-shadow: 0 8px 20px rgba(214, 51, 108, 0.3);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(214, 51, 108, 0.4); }
    .btn-secondary {
      background: white; color: var(--primary); border: 2px solid var(--primary);
      margin-top: 15px; box-shadow: none;
    }

    /* Surprise Reveal Section */
    #surprise-section { display: none; text-align: center; opacity: 0; transform: scale(0.95); }
    .reveal-active { display: block !important; animation: smoothReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes smoothReveal { to { opacity: 1; transform: scale(1); } }

    /* Photo Gallery (Mobile-friendly snap scroll) */
    .gallery-container {
      display: none;
      width: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      white-space: nowrap;
      padding: 10px 0 25px 0;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }
    .gallery-container::-webkit-scrollbar { display: none; } /* Chrome */
    
    .gallery-item {
      display: inline-block;
      scroll-snap-align: center;
      width: 220px; height: 220px;
      margin: 0 10px;
      border-radius: 20px;
      border: 4px solid white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery-item:first-child { margin-left: 20px; }
    .gallery-item:last-child { margin-right: 20px; }

    /* CSS Birthday Cake */
    .cake-container { margin: 20px auto; position: relative; width: 120px; height: 120px; }
    .cake { position: absolute; bottom: 0; width: 100%; height: 60px; background: #fdf6e3; border-radius: 10px 10px 0 0; border: 3px solid #fad390; border-bottom: none; }
    .icing { position: absolute; top: 0; width: 100%; height: 20px; background: var(--primary-light); border-radius: 10px 10px 20px 20px; }
    .candle { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 12px; height: 35px; background: repeating-linear-gradient(45deg, white, white 5px, var(--primary) 5px, var(--primary) 10px); border-radius: 4px; }
    .flame { position: absolute; bottom: 98px; left: 50%; transform: translateX(-50%); width: 16px; height: 24px; background: var(--gold); border-radius: 50% 50% 20% 20%; animation: flicker 0.6s infinite alternate; }
    @keyframes flicker { 0% { transform: translateX(-50%) scale(1); opacity: 0.9; } 100% { transform: translateX(-50%) scale(1.1); opacity: 1; background: #ff9f43; } }

    /* Message Typography */
    .message-box {
      font-size: 1.1rem; line-height: 1.6; color: #444; margin: 25px 0;
      position: relative; padding: 0 20px;
    }
    .message-box::before, .message-box::after { content: '"'; font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--primary-light); opacity: 0.3; position: absolute; }
    .message-box::before { top: -20px; left: -10px; }
    .message-box::after { bottom: -40px; right: -10px; }

    /* Floating CSS Balloons & Hearts */
    .balloon {
      position: absolute; width: 40px; height: 50px; background: var(--primary-light);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      bottom: -100px; animation: floatUp 8s ease-in forwards; opacity: 0.8;
    }
    .balloon::before { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 10px solid var(--primary-light); }
    .balloon::after { content: ""; position: absolute; bottom: -50px; left: 50%; width: 1px; height: 50px; background: rgba(0,0,0,0.2); }
    
    .heart {
      position: absolute; bottom: -50px; width: 20px; height: 20px; background: var(--primary);
      transform: rotate(-45deg); animation: floatUp 6s ease-in forwards;
    }
    .heart::before, .heart::after { content: ""; position: absolute; width: 20px; height: 20px; background: var(--primary); border-radius: 50%; }
    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: 10px; }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(20deg) scale(1.2); opacity: 0; }
    }

    /* Share Section */
    .share-box {
      margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;
    }
    .share-note { font-size: 0.75rem; color: #888; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="bg-animations"></div>

  <!-- SETUP FORM -->
  <main class="glass-card" id="setup-section">
    <h1>Design a Surprise ✨</h1>
    <p style="text-align:center; color:#666; margin-bottom:25px; font-size:0.9rem;">Create a gorgeous, personalized birthday experience.</p>
    
    <form id="birthday-form">
      <div class="form-group">
        <label for="bday-name">Who is celebrating?</label>
        <input type="text" id="bday-name" placeholder="e.g. Sarah" required>
      </div>
      
      <div class="form-group">
        <label for="relation">Relationship to you</label>
        <input type="text" id="relation" placeholder="e.g. Soulmate, Best Friend" required>
      </div>
      
      <div class="form-group">
        <label for="custom-msg">Your Heartfelt Message</label>
        <textarea id="custom-msg" rows="4" placeholder="Write something beautiful..." required></textarea>
      </div>
      
      <div class="form-group">
        <label for="sender-name">Your Name</label>
        <input type="text" id="sender-name" placeholder="e.g. James" required>
      </div>

      <div class="form-group">
        <label for="photo-upload">Upload Memories (Multiple Photos)</label>
        <input type="file" id="photo-upload" accept="image/*" multiple>
        <p class="share-note">*Photos stay on your device for privacy.</p>
      </div>

      <button type="submit" class="btn">Generate Magic ✨</button>
    </form>
  </main>

  <!-- SURPRISE REVEAL -->
  <main class="glass-card" id="surprise-section">
    
    <div class="gallery-container" id="photo-gallery">
      <!-- Photos will be injected here -->
    </div>

    <h2>Happy Birthday<br><span class="script-text" id="out-name"></span></h2>
    
    <div class="cake-container">
      <div class="flame"></div>
      <div class="candle"></div>
      <div class="cake"><div class="icing"></div></div>
    </div>

    <p style="font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem;">To my beautiful <span id="out-relation" style="color: var(--primary);"></span>,</p>
    
    <div class="message-box" id="out-msg"></div>
    
    <p style="margin-top: 20px; font-size: 0.9rem; color: #666;">With all my love,</p>
    <span class="script-text" id="out-sender" style="font-size: 2.2rem; margin-top: 0;"></span>
    
    <div class="share-box">
      <button id="share-btn" class="btn">🔗 Copy Shareable Link</button>
      <p class="share-note">Send this link to surprise them! (Text & animations will be shared. Photos remain local).</p>
      <button onclick="location.hash=''; location.reload()" class="btn btn-secondary">Create Another</button>
    </div>
  </main>

  <script>
    // Utility for Unicode safe Base64 encoding/decoding (supports Emojis)
    function encodeData(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function decodeData(str) {
      return JSON.parse(decodeURIComponent(escape(atob(str))));
    }

    // On Load: Check if opened via a shared link
    window.onload = function() {
      const hash = window.location.hash.substring(1);
      if(hash.startsWith('gift=')) {
        try {
          const data = decodeData(hash.substring(5));
          showSurprise(data.n, data.r, data.m, data.s, true);
        } catch(e) {
          console.error("Invalid share link.");
        }
      }
    };

    // Handle Form Submission
    document.getElementById('birthday-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('bday-name').value;
      const relation = document.getElementById('relation').value;
      const msg = document.getElementById('custom-msg').value;
      const sender = document.getElementById('sender-name').value;
      const photoFiles = document.getElementById('photo-upload').files;

      // Handle Image Uploads (Local Gallery)
      const gallery = document.getElementById('photo-gallery');
      gallery.innerHTML = ''; // clear previous
      
      if (photoFiles.length > 0) {
        gallery.style.display = 'block';
        Array.from(photoFiles).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'gallery-item';
            gallery.appendChild(img);
          }
          reader.readAsDataURL(file);
        });
      }

      // Generate Shareable Link Data
      const shareData = encodeData({ n: name, r: relation, m: msg, s: sender });
      window.currentShareLink = window.location.origin + window.location.pathname + '#gift=' + shareData;

      showSurprise(name, relation, msg, sender, false);
    });

    // Reveal Logic
    function showSurprise(name, relation, msg, sender, isSharedView) {
      // Set Text
      document.getElementById('out-name').textContent = name;
      document.getElementById('out-relation').textContent = relation;
      document.getElementById('out-msg').textContent = msg;
      document.getElementById('out-sender').textContent = sender;

      // Hide form, show surprise with animation
      document.getElementById('setup-section').style.display = 'none';
      const surprise = document.getElementById('surprise-section');
      surprise.classList.add('reveal-active');

      // Adjust UI if viewing as recipient
      if(isSharedView) {
        document.getElementById('share-btn').style.display = 'none';
        document.querySelector('.share-note').style.display = 'none';
      }

      // Trigger Effects
      fireConfetti();
      spawnBalloonsAndHearts();
    }

    // Share Button Logic
    document.getElementById('share-btn').addEventListener('click', function() {
      navigator.clipboard.writeText(window.currentShareLink).then(() => {
        const btn = document.getElementById('share-btn');
        btn.innerHTML = "✅ Copied to Clipboard!";
        btn.style.background = "#2ed573";
        setTimeout(() => {
          btn.innerHTML = "🔗 Copy Shareable Link";
          btn.style.background = "linear-gradient(45deg, var(--primary), var(--primary-light))";
        }, 3000);
      });
    });

    // Confetti Animation
    function fireConfetti() {
      var duration = 4000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#d6336c', '#ff87ab', '#f5b041'] });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#d6336c', '#ff87ab', '#f5b041'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    // CSS Balloons & Hearts Generator
    function spawnBalloonsAndHearts() {
      const container = document.getElementById('bg-animations');
      const colors = ['#ff87ab', '#f5b041', '#d6336c', '#a29bfe', '#81ecec'];
      
      // Spawn Elements iteratively to not overload the DOM instantly
      let count = 0;
      const interval = setInterval(() => {
        if(count > 25) { clearInterval(interval); return; }
        
        // Randomize element type
        const isBalloon = Math.random() > 0.4;
        const el = document.createElement('div');
        el.className = isBalloon ? 'balloon' : 'heart';
        
        // Randomize position and styling
        el.style.left = Math.random() * 90 + 'vw';
        el.style.animationDuration = (Math.random() * 4 + 5) + 's'; // 5s - 9s
        
        if(isBalloon) {
          const color = colors[Math.floor(Math.random() * colors.length)];
          el.style.background = color;
          // Dynamically change the tie color to match the balloon
          el.style.borderBottomColor = color; 
        }

        container.appendChild(el);
        
        // Cleanup DOM after animation ends
        setTimeout(() => { el.remove(); }, 10000);
        count++;
      }, 300);
    }
  </script>
</body>
  </html>
